name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build each activity with Vite and put it in its own sub-folder of the site
      - name: Build activities
        run: |
          mkdir -p _site
          cp index.html _site/
          for n in 1 2 3 4 5; do
            dir="Activity 1.$n"
            (cd "$dir" && npm ci && npm run build)
            cp -r "$dir/dist" "_site/activity-1-$n"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
